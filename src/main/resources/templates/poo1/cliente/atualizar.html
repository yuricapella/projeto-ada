<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Atualizar Cliente')}">
    <meta charset="UTF-8">
    <title>Atualizar Cliente</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/navigation :: mainNav}"></div>

    <main>
        <section class="form-section">
            <h2>Atualizar Novo Cliente</h2>
            <form th:action="@{/poo1/cliente/atualizar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post">
                <input type="hidden" name="_method" value="put"/>
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" th:field="*{nome}" required>
                    <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="documento">Tipo de Documento:</label>
                    <select id="documento" th:field="*{documento}" required>
                        <option value="">-- Selecione --</option>
                        <option value="CPF">CPF</option>
                        <option value="CNPJ">CNPJ</option>
                    </select>
                    <div th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" th:field="*{endereco}" required>
                    <div th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" th:field="*{telefone}" required>
                    <div th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="error-message"></div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn">Salvar</button>
                    <a th:href="@{/poo1/cliente/listar}" class="btn">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
