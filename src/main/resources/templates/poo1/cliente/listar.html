<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Clientes')}">
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/navigation :: mainNav}"></div>

    <main>
        <section class="welcome">
            <h2>Lista de Clientes</h2>
            <p>Abaixo estão os clientes cadastrados no sistema.</p>
        </section>

        <div th:if="${erroClienteComLocacao}" class="error-message">
            <p th:text="${erroClienteComLocacao}"></p>
        </div>

        <div th:if="${#lists.isEmpty(clientes)}" class="error-message">
            <p>Nenhum cliente encontrado.</p>
        </div>

        <div class="button-group">
            <a id="btn-cadastrar" th:href="@{/poo1/cliente/cadastrar}" class="btn">Cadastrar Novo Cliente</a>
        </div>

        <div th:unless="${#lists.isEmpty(clientes)}">
            <table>
                <thead>
                <tr>
                    <th>#</th><th>Nome</th><th>Documento</th><th>Endereço</th><th>Telefone</th><th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente, iterStat : ${clientes}">
                    <td th:text="${cliente.id}"></td>
                    <td th:text="${cliente.nome}"></td>
                    <td th:text="${cliente.documento}"></td>
                    <td th:text="${cliente.endereco}"></td>
                    <td th:text="${cliente.telefone}"></td>
                    <td>
                        <a th:href="@{/poo1/cliente/atualizar/{id}(id=${cliente.id})}" class="btn">Editar</a>
                        <form th:action="@{/poo1/cliente/deletar/{id}(id=${cliente.id})}" method="post"
                              onsubmit="return confirm('Confirma exclusão?');" style="display:inline;">
                            <input type="hidden" name="_method" value="DELETE">
                            <button id="btn-excluir" type="submit" class="btn btn-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
