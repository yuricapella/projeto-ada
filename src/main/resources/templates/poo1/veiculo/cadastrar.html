<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Cadastrar Veículo')}">
    <meta charset="UTF-8">
    <title>Cadastrar Veículo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/navigation :: mainNav}"></div>

    <main>
        <section class="form-section">
            <h2>Cadastrar Novo Veículo</h2>
            <form th:action="@{/poo1/veiculo/salvar}" th:object="${veiculo}" method="post">

                <div class="form-group">
                    <label for="tipoClasse">Tipo do Veículo:</label>
                    <select id="tipoClasse" th:field="*{tipoClasse}" required>
                        <option value="">-- Selecione --</option>
                        <option th:each="tc : ${tiposClasseVeiculo}"
                                th:value="${tc}"
                                th:text="${tc.name()}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('tipoClasse')}" th:errors="*{tipoClasse}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="modelo">Modelo:</label>
                    <input type="text" id="modelo" th:field="*{modelo}" required>
                    <div th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="placa">Placa:</label>
                    <input type="text" id="placa" th:field="*{placa}" required>
                    <div th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="valorDiaria">Valor da Diária:</label>
                    <input type="number" step="0.01" id="valorDiaria" th:field="*{valorDiaria}" required>
                    <div th:if="${#fields.hasErrors('valorDiaria')}" th:errors="*{valorDiaria}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="disponivel">Disponível:</label>
                    <select id="disponivel" th:field="*{disponivel}" required>
                        <option value="">-- Selecione --</option>
                        <option th:value="true">Sim</option>
                        <option th:value="false">Não</option>
                    </select>
                    <div th:if="${#fields.hasErrors('disponivel')}" th:errors="*{disponivel}" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="tipo">Categoria de Veículo:</label>
                    <select id="tipo" th:field="*{tipo}" required>
                        <option value="">-- Selecione --</option>
                        <option th:each="tipo : ${T(tech.ada.projeto_ada.poo1.veiculo.util.TipoVeiculo).values()}"
                                th:value="${tipo}"
                                th:text="${tipo}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="error-message"></div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn">Salvar</button>
                    <a th:href="@{/poo1/veiculo/listar}" class="btn">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
