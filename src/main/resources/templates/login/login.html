<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Login - Sistema Projeto Ada')}">
    <meta charset="UTF-8">
    <title>Login - Sistema Projeto Ada</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <header th:replace="~{fragments/header :: header(pageTitle='Login - Sistema Projeto Ada')}"></header>
    <main>
        <section class="welcome">
            <h2>Acesso ao Sistema</h2>
            <p>Faça login para acessar todas as funcionalidades do sistema.</p>
        </section>
        <div class="form-container">
            <div th:if="${param.error}" class="error-message">
                <p>Email ou senha inválidos. Tente novamente.</p>
            </div>
            <div th:if="${param.logout}" class="success-message">
                <p>Logout realizado com sucesso.</p>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Entrar</button>
                </div>
                <div class="form-links">
                    <p>Não tem uma conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
                </div>
            </form>
        </div>
        <div class="demo-users">
            <h3>Usuários de Demonstração</h3>
            <p>Selecione uma das credenciais abaixo para testar:</p>
            <div class="users-grid">
                <button type="button" class="user-item" data-email="joao.silva@email.com" data-senha="senha123">
                    <code>joao.silva@email.com</code>
                    <code>senha123</code>
                </button>
                <button type="button" class="user-item" data-email="maria.oliveira@email.com" data-senha="senha456">
                    <code>maria.oliveira@email.com</code>
                    <code>senha456</code>
                </button>
                <button type="button" class="user-item" data-email="pedro.santos@email.com" data-senha="senha789">
                    <code>pedro.santos@email.com</code>
                    <code>senha789</code>
                </button>
                <button type="button" class="user-item" data-email="ana.rodrigues@email.com" data-senha="senhaabc">
                    <code>ana.rodrigues@email.com</code>
                    <code>senhaabc</code>
                </button>
                <button type="button" class="user-item" data-email="yuri@yuri.com" data-senha="yuri">
                    <code>yuri@yuri.com</code>
                    <code>yuri</code>
                </button>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<script>
    document.querySelectorAll('.user-item').forEach(button => {
        button.addEventListener('click', () => {
            const email = button.getAttribute('data-email');
            const senha = button.getAttribute('data-senha');

            document.getElementById('email').value = email;
            document.getElementById('senha').value = senha;

            document.querySelector('form').submit();
        });
    });
</script>
</body>
</html>
